<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>
  (function () {
    var saved = localStorage.getItem("theme");
    if (saved === "light" || saved === "dark") {
      document.documentElement.setAttribute("data-theme", saved);
    }
  })();
</script>
<title>백테스트 결과 상세 - 자산배분계산기</title>
<meta name="robots" content="noindex, nofollow" />

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="css/style.css?v=23" />
<style>
  .report-page {
    max-width: 900px;
  }
</style>
</head>
<body>
<div class="page report-page">

  <header class="hero">
    <h1>백테스트 결과 상세</h1>
    <p>메인 페이지에서 넘어온 설정으로 다시 계산한 결과입니다.</p>
    <div class="hero-actions">
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="다크/라이트 모드 전환">🌙</button>
      <a class="menu-toggle" href="index.html" aria-label="메인으로 돌아가기">←</a>
    </div>
  </header>

  <div class="card">
    <h2>결과</h2>
    <div id="allocator-result">
      <p class="result-placeholder">불러오는 중...</p>
    </div>
  </div>

  <footer>
    이 결과는 과거 데이터를 기반으로 한 참고용 시뮬레이션이며, 실제 투자 수익을 보장하지 않습니다.
    투자에 대한 최종 결정과 책임은 투자자 본인에게 있습니다.
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="data/asset-data.js"></script>
<script src="js/finance.js"></script>
<script src="js/render.js?v=4"></script>
<script src="js/result.js?v=7"></script>
</body>
</html>
